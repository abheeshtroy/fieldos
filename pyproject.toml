[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldos"
version = "0.0.1"
description = "Early-stage fieldOS scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
fieldos = "fieldos_cli.main:app"

[tool.setuptools]
packages = ["app", "fieldos_engine", "fieldos_cli"]

[tool.setuptools.package-dir]
app = "backend/app"
fieldos_engine = "engine/fieldos_engine"
fieldos_cli = "cli/fieldos_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "engine", "cli"]

[tool.ruff]
line-length = 100
