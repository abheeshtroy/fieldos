services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: fieldos_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fieldos_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pg_data:
